# APK'yı derler, kimliğini denetler ve GitHub Release'e koyar. Yalnız `weem-v*` etiketi ya da elle.
# `weem-v*` etiketi = WEEM sürümü: release APK (com.kuryelog.app, R8'li, `weem-<sürüm>.apk` + SHA-256) Release'in tek dosyası.
# Elle çalıştırma = release APK (com.kuryelog.app, R8'li; ön sürüm `weem-build-N`): telefonlara kurulan asıl WEEM (23 Ekim: Rawstats ve
# YolGo telefonlardan kaldırıldı, A10.4). `dev` işaretliyse yanına .dev APK (com.kuryelog.app.dev, ayrı uygulama) da eklenir.
name: APK

on:
  push:
    tags: ['weem-v*']
  workflow_dispatch:
    inputs:
      dev:
        description: '.dev APK (ayrı uygulama, com.kuryelog.app.dev) de eklensin'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: bash tools/setup-android-sdk.sh
      - name: logic/ testleri
        run: ./gradlew -p logic test --console=plain
      - name: Gömülü harita (Geofabrik → graf, SRTM, yerler; MAP.md 2.11)
        run: WEEM_VERSION=$(sed -n 's/^weem.versionName=//p' gradle.properties) bash ci/build_map.sh
      - name: Android birim testleri ve APK
        # Google Maps anahtarı (MAP.md 6.10): gizli değişken yoksa Google altlığı kapalı derlenir.
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          WANT_DEV_APK: ${{ inputs.dev }}
        run: ./gradlew test assembleRelease $([ "$WANT_DEV_APK" = true ] && echo assembleDebug) --console=plain
      - name: Kimlik denetimi (.dev)
        if: ${{ inputs.dev }}
        run: ci/check_identity.sh app/build/outputs/apk/debug/app-debug.apk com.kuryelog.app.dev
      - name: Kimlik denetimi (release)
        run: ci/check_identity.sh app/build/outputs/apk/release/app-release.apk com.kuryelog.app
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_DEV_APK: ${{ inputs.dev }}
        run: |
          ver=$(sed -n 's/^weem.versionName=//p' gradle.properties)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # Sürüm etiketi: tek dosya release APK; etiket gradle.properties'teki sürümle aynı olmalı.
            [ "$GITHUB_REF_NAME" = "weem-v$ver" ] || { echo "HATA: etiket $GITHUB_REF_NAME, gradle.properties weem.versionName=$ver"; exit 1; }
            apk="weem-${ver}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$apk"
            sha256sum "$apk" > "$apk.sha256"
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              # Etiket GitHub arayüzünden Release olarak açıldıysa dosyalar ona eklenir.
              gh release upload "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --clobber
            else
              gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" --title "WEEM $ver" --generate-notes
            fi
          else
            # Elle: asıl WEEM (release APK); istenirse .dev de.
            apk="weem-${ver}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$apk"
            sha256sum "$apk" > "$apk.sha256"
            files=("$apk" "$apk.sha256")
            if [ "$WANT_DEV_APK" = true ]; then
              dev="weem-${ver}-dev.apk"
              cp app/build/outputs/apk/debug/app-debug.apk "$dev"
              files+=("$dev")
            fi
            gh release create "weem-build-${GITHUB_RUN_NUMBER}" "${files[@]}" --title "WEEM $ver — weem-build-${GITHUB_RUN_NUMBER}" --generate-notes --prerelease --target "$GITHUB_SHA"
          fi
