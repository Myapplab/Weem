<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Daha fazla · Ayarlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;icon_names=accessibility_new,add,alt_route,arrow_back,backup,bar_chart,battery_5_bar,battery_alert,battery_full,bluetooth,bluetooth_searching,bolt,check,check_circle,chevron_left,chevron_right,close,contrast,dark_mode,delete,devices,door_front,edit,electric_bolt,electric_scooter,error,expand_less,expand_more,explore,fiber_manual_record,folder,folder_zip,fullscreen,gps_off,history,home,info,inventory_2,keyboard_arrow_right,language,light_mode,link,location_on,lock,map,menu,more_horiz,my_location,navigation,notifications,palette,partly_cloudy_day,payments,person,phone_android,play_arrow,punch_clock,qr_code_scanner,radio_button_checked,radio_button_unchecked,receipt_long,refresh,restaurant,route,schedule,search,settings,share,shield,speed,splitscreen,sports_score,stop,storefront,thermostat,thumb_down,thumb_up,timer,touch_app,trending_up,tune,visibility_off,warning,water_drop,wifi&amp;display=block">
<style>
body{margin:0}
:where(.ph) *{box-sizing:border-box}
:where(.ph) button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:where(.ph) h1,:where(.ph) h2{margin:0}
.ph{--bg:#F4F5F8;--sf:#FFFFFF;--r1:#ECEEF2;--r2:#E3E6EB;--ol:#DCDFE5;--olS:#C5CAD3;--tx:#0E1015;--mu:#565C6A;--ok:#0B7A43;--okC:#DDF4E7;--wn:#8A4B00;--wnC:#FFEDD5;--dg:#C4291C;--dgC:#FDE8E6;--ac:#2C3EA8;--acI:#FFFFFF;--acT:#2838A1;--acC:#E5ECFF;--acO:#1C297C;--e0:none;--e1:0 1px 2px rgba(14,16,21,.10),0 4px 12px rgba(14,16,21,.08);position:relative;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Inter,Roboto,system-ui,sans-serif;font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
.ph.night{--bg:#0E0F13;--sf:#17191F;--r1:#21242C;--r2:#2B2F38;--ol:#2E323C;--olS:#3D424E;--tx:#F3F4F7;--mu:#A5ABB8;--ok:#62D69B;--okC:#102E1F;--wn:#FFC27A;--wnC:#382607;--dg:#FF8A80;--dgC:#3A1614;--ac:#9BB1F5;--acI:#0E1533;--acT:#AABFFC;--acC:#1F2A56;--acO:#DDE4F9;--e0:inset 0 0 0 1px var(--ol);--e1:0 0 0 1px var(--ol),0 4px 16px rgba(0,0,0,.40)}
.ph.acc-mono{--ac:#0E1015;--acI:#FFFFFF;--acT:#0E1015;--acC:#E3E6EB;--acO:#0E1015}
.ph.night.acc-mono{--ac:#F3F4F7;--acI:#0E0F13;--acT:#F3F4F7;--acC:#2B2F38;--acO:#F3F4F7}
.i{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;flex:none;user-select:none}
.i.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.hl{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.015em}
.ts{font-size:16px;line-height:22px;font-weight:600}
.bm{font-size:15px;line-height:22px}
.bs{font-size:13px;line-height:18px}
.mu{color:var(--mu)}
.x{display:flex;align-items:center}
.y{display:flex;flex-direction:column}
.f1{flex:1 1 0;min-width:0}
.grp{background:var(--sf);border-radius:16px;box-shadow:var(--e0);overflow:hidden}
.lrow{display:flex;align-items:center;gap:14px;min-height:72px;padding:12px 12px 12px 16px;width:100%;text-align:left}
.lrow.r{min-height:56px;padding:8px 16px;cursor:pointer}
.ibox{width:40px;height:40px;border-radius:12px;background:var(--r1);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--tx)}
.hr{height:1px;background:var(--ol);margin-left:70px}
.hr.r{margin-left:52px}
.sect{font-size:13px;line-height:16px;font-weight:600;color:var(--mu);padding:20px 4px 8px}
.badge{height:24px;border-radius:999px;padding:0 9px;display:inline-flex;align-items:center;font-size:12px;line-height:16px;font-weight:700;background:var(--dgC);color:var(--dg);flex:none}
.rad{width:20px;height:20px;margin:0;accent-color:var(--ac);flex:none}
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;padding:8px 4px 12px;background:var(--sf);box-shadow:0 -1px 0 var(--ol);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mu);font-size:12px;line-height:16px;font-weight:600;min-width:0}
.nav .ind{width:56px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.nav .nl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button.on{color:var(--tx)}
.nav button.on .ind{background:var(--acC);color:var(--acO)}
.nav button.on .i{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.page{padding:36px 16px 120px;display:flex;flex-direction:column}
</style>
</helmet>
<div class="ph {{mode}}" style="width: 390px; height: 1120px">
<div class="page">
<h1 class="hl" style="margin-bottom: 16px">Ayarlar</h1>
<div class="grp">
<button class="lrow"><span class="ibox"><span class="i">shield</span></span><span class="y f1"><span class="ts">İzinler</span><span class="bs mu">İzinler ve pil ayarları</span></span><span class="badge">! 5/7</span><span class="i mu">chevron_right</span></button>
<div class="hr"></div>
<button class="lrow"><span class="ibox"><span class="i">home</span></span><span class="y f1"><span class="ts">Ev konumu</span><span class="bs mu">Ev konumu ve otomatik vardiya</span></span><span class="i mu">chevron_right</span></button>
<div class="hr"></div>
<button class="lrow"><span class="ibox"><span class="i">map</span></span><span class="y f1"><span class="ts">Harita ayarları</span><span class="bs mu">Harita görünümü, harita verisi, Google Maps</span></span><span class="i mu">chevron_right</span></button>
<div class="hr"></div>
<button class="lrow"><span class="ibox"><span class="i">receipt_long</span></span><span class="y f1"><span class="ts">Siparişler ayarları</span><span class="bs mu">Komisyon, ekran, net kazanç ve günlük hedef</span></span><span class="i mu">chevron_right</span></button>
<div class="hr"></div>
<button class="lrow"><span class="ibox"><span class="i">folder</span></span><span class="y f1"><span class="ts">Kayıtlar</span><span class="bs mu">Kayıtlar ve içe aktarma</span></span><span class="i mu">chevron_right</span></button>
<div class="hr"></div>
<button class="lrow"><span class="ibox"><span class="i">devices</span></span><span class="y f1"><span class="ts">2 telefon modu</span><span class="bs mu">2 telefon modunu aç</span></span><span class="i mu">chevron_right</span></button>
</div>
<h2 class="sect">Dil</h2>
<div class="grp">
<label class="lrow r"><input class="rad" type="radio" name="dil" checked="checked"><span class="bm f1">Telefon dili</span></label>
<div class="hr r"></div>
<label class="lrow r"><input class="rad" type="radio" name="dil"><span class="bm f1">Türkçe</span></label>
<div class="hr r"></div>
<label class="lrow r"><input class="rad" type="radio" name="dil"><span class="bm f1">Azərbaycanca</span></label>
</div>
<h2 class="sect">Tema</h2>
<div class="grp">
<label class="lrow r"><input class="rad" type="radio" name="tema"><span class="bm f1">Telefonu izle</span><span class="i mu">contrast</span></label>
<div class="hr r"></div>
<label class="lrow r"><input class="rad" type="radio" name="tema" checked="checked"><span class="bm f1">Gündüz</span><span class="i mu">light_mode</span></label>
<div class="hr r"></div>
<label class="lrow r"><input class="rad" type="radio" name="tema"><span class="bm f1">Gece</span><span class="i mu">dark_mode</span></label>
</div>
<span class="bs mu" style="text-align: center; padding-top: 24px">Sürüm 1.0.0</span>
</div>
<nav class="nav" aria-label="Alt menü">
<button><span class="ind"><span class="i">map</span></span><span class="nl">Harita</span></button>
<button><span class="ind"><span class="i">receipt_long</span></span><span class="nl">Siparişler</span></button>
<button><span class="ind"><span class="i">electric_scooter</span></span><span class="nl">Scooter</span></button>
<button><span class="ind"><span class="i">devices</span></span><span class="nl">Uzaktan</span></button>
<button class="on" aria-current="page"><span class="ind"><span class="i">menu</span></span><span class="nl">Daha fazla</span></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"enum","options":["lacivert","mono"],"default":"lacivert"},"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const mono = (this.props.accent ?? 'lacivert') === 'mono';
    return { mode: (dark ? 'night' : 'day') + (mono ? ' acc-mono' : '') };
  }
}
</script>
</body>
</html>
