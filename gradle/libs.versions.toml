# WEEM sürüm kataloğu — iki build de kullanır (kök Android build ve logic/).
# Araç sürümleri Rawstats (kurye_nav rawstats @ 6388c04) ile aynı.
[versions]
agp = "9.1.0"
kotlin = "2.4.0"
junit = "4.13.2"
org-json = "20240303"
compose-bom = "2026.02.01"
activity-compose = "1.13.0"
# Compose zaten bu sürümü çeker; logic/core StateFlow için (plan 4.3, 4.7).
kotlinx-coroutines = "1.9.0"
# Ekran OCR (CAPTURE.md 3.3, 7.3; Rawstats ile aynı; model APK içinde, Latin yazısı).
mlkit-text-recognition = "16.0.1"
# :app Compose ekran denemeleri (JVM'de, cihazsız; A3.8).
robolectric = "4.14.1"
androidx-test-core = "1.6.1"
# Harita yüzeyleri (MAP.md 6.4, S4): MapLibre Native (OSM raster + vektör) ve Google Maps SDK (anahtarlı derlemede).
maplibre = "13.6.1"
play-services-maps = "20.0.0"
# MapLibre'nin kendi HTTP istemcisi (çalışma zamanında zaten var): OSM karo politikası için User-Agent.
okhttp = "4.12.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "org-json" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkit-text-recognition" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
maplibre-android = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "play-services-maps" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
